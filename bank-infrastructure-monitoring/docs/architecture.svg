<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-label="Bank Infrastructure Monitoring architecture">
<defs><style>text{font-family:Arial,sans-serif;fill:#e8eef8}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#9bb0ce}.head{font-size:23px;font-weight:700}.body{font-size:17px;fill:#bfd0e8}.small{font-size:15px;fill:#9bb0ce}.node{fill:#17243a;stroke:#46638b;stroke-width:2}.edge{stroke:#6ca6ef;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke:#61c7a5}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#6ca6ef" stroke-width="1.6"/></marker></defs>
<rect width="1280" height="850" fill="#0d1524"/><text x="64" y="65" class="title">BANK INFRASTRUCTURE MONITORING</text><text x="64" y="98" class="sub">VMware Workstation • Ubuntu Server • Isolated lab environment</text>
<rect x="64" y="145" width="1152" height="650" rx="22" fill="#101d31" stroke="#263e61" stroke-width="2"/><text x="88" y="178" class="small">VMnet1 HOST-ONLY · 192.168.56.0/24 · NAT adapter for VM internet access</text>
<rect x="370" y="210" width="540" height="126" rx="15" class="node"/><text x="640" y="246" text-anchor="middle" class="head">MON-01 · 192.168.56.10</text><text x="640" y="278" text-anchor="middle" class="body">Prometheus :9090 · Grafana :3000</text><text x="640" y="306" text-anchor="middle" class="body">Node Exporter :9100 · Grafana Alerting</text>
<rect x="977" y="222" width="207" height="98" rx="14" class="node dash"/><text x="1080" y="260" text-anchor="middle" class="head">Telegram</text><text x="1080" y="288" text-anchor="middle" class="small">Firing / Resolved</text>
