<rect x="93" y="470" width="280" height="160" rx="15" class="node"/><text x="233" y="514" text-anchor="middle" class="head">MON-01</text><text x="233" y="546" text-anchor="middle" class="body">192.168.56.10</text><text x="233" y="579" text-anchor="middle" class="body">Node Exporter :9100</text><text x="233" y="607" text-anchor="middle" class="small">CPU · RAM · Disk · Network</text>
